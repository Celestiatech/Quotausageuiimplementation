<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AutoApply CV Copilot</title>
    <style>html,body,body.cp-connected,body.cp-disconnected{width:350px;min-width:350px;max-width:350px}body{margin:0;overflow:hidden}.popup-content{opacity:0}</style>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="accent-bar"></div>
    <main class="wrap">
      <header class="head">
        <div
          id="popupToggle"
          class="brand"
          role="button"
          tabindex="0"
          aria-label="Toggle popup content"
          aria-expanded="true"
          title="Hide popup content"
        >
          <img class="brand-logo" src="../icons/icon128.png" alt="AutoApply CV" />
          <div class="brand-text">
            <h1>AutoApply CV</h1>
            <p class="sub">LinkedIn job assistant</p>
          </div>
        </div>
        <span id="statusBadge" class="status-badge idle">Idle</span>
      </header>

      <section id="popupContent" class="popup-content">
        <section id="accountCard" class="account-card disconnected">
          <div class="account-head">
            <div class="account-title-wrap">
              <span class="account-dot"></span>
              <strong id="accountTitle">Account</strong>
            </div>
            <span id="accountBadge" class="account-badge disconnected">Disconnected</span>
          </div>
          <p id="accountText" class="account-text">
            Sign in to connect your profile and enable auto-apply controls.
          </p>
          <div class="actions account-actions">
            <button id="accountAction" class="btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
              <span id="accountActionText">Sign in to AutoApply CV</span>
            </button>
          </div>
        </section>

        <section id="runArea">
          <section class="now-card">
            <div class="now-icon" id="nowIcon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="now-text">
              <p id="nowTitle" class="now-title">Loading run state...</p>
              <p id="nowDetail" class="now-detail">Connecting to extension service worker.</p>
            </div>
          </section>

          <div class="mode-control">
            <label class="mode-switch" for="liveModeToggle">
              <input id="liveModeToggle" type="checkbox" />
              <span class="mode-switch-ui" aria-hidden="true"></span>
              <span class="mode-switch-text">Live Auto Submit</span>
            </label>
            <span id="modeBadge" class="mode-badge">Dry Run</span>
          </div>

          <div class="actions primary">
            <button id="start" class="btn-start">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Start
            </button>
            <button id="pause" class="btn-pause">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              Pause
            </button>
            <button id="stop" class="btn-stop">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
              Stop
            </button>
          </div>

          <div class="utility-row">
            <label class="mode-switch" for="debugToggle">
              <input id="debugToggle" type="checkbox" />
              <span class="mode-switch-ui" aria-hidden="true"></span>
              <span class="mode-switch-text">Debug logs</span>
            </label>
            <button id="clearLogs" class="btn-clear">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              Clear logs
            </button>
          </div>
        </section>

        <p id="status" class="status"></p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
